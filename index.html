<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agenda de Demandas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231e2e52'/><rect x='6.5' y='9' width='19' height='16.5' rx='3.2' fill='%23ffffff'/><path d='M6.5 12.2a3.2 3.2 0 0 1 3.2-3.2h12.6a3.2 3.2 0 0 1 3.2 3.2v1.3H6.5z' fill='%23c0872b'/><rect x='10.4' y='6.6' width='2.4' height='4.6' rx='1.2' fill='%231e2e52'/><rect x='19.2' y='6.6' width='2.4' height='4.6' rx='1.2' fill='%231e2e52'/><circle cx='16' cy='19.4' r='3.1' fill='%231e2e52'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#eef1f6; --paper:#ffffff; --ink:#14213d; --text:#2b3244; --muted:#7b8496;
    --line:#e4e8f0; --brand:#1e2e52; --brand-soft:#e8ecf6;
    --gold:#c0872b; --gold-soft:#f7edd8; --steel:#3766ac; --steel-soft:#e5edf8;
    --teal:#2e8b7f; --teal-soft:#dcefec;
    --done:#9aa2b2; --danger:#b8492f; --danger-soft:#f8e5df;
    --shadow:0 1px 2px rgba(20,33,61,.05), 0 8px 28px rgba(20,33,61,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  /* header */
  .top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);
    display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .logo svg{width:20px;height:20px}
  .brand h1{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .brand span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
  .top .spacer{flex:1}
  .btn{border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:14px;
    border-radius:11px;padding:11px 16px;display:inline-flex;align-items:center;gap:8px;
    transition:transform .06s ease, background .15s ease, box-shadow .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow)}
  .btn-primary:hover{background:#182545}
  .btn-ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{border-color:#cfd6e4}
  .btn svg{width:17px;height:17px}

  /* radar */
  .radar{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;margin-bottom:18px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
  .radar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
  .radar.hot::before{background:var(--gold)}
  .radar-lead{display:flex;align-items:center;gap:11px}
  .radar-pulse{width:11px;height:11px;border-radius:50%;background:var(--done);flex:0 0 auto}
  .radar.hot .radar-pulse{background:var(--gold);box-shadow:0 0 0 0 rgba(192,135,43,.5);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,135,43,.45)}70%{box-shadow:0 0 0 9px rgba(192,135,43,0)}100%{box-shadow:0 0 0 0 rgba(192,135,43,0)}}
  .radar-lead b{font-family:"Space Grotesk",sans-serif;font-size:14px;color:var(--ink)}
  .radar-lead small{display:block;color:var(--muted);font-size:12px}
  .radar-items{display:flex;gap:9px;flex-wrap:wrap;flex:1}
  .chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:9px;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .chip.today{background:var(--gold-soft);color:#8a6015}
  .chip.tmrw{background:var(--steel-soft);color:#274d82}
  .chip.late{background:var(--danger-soft);color:#8f331f}
  .chip.calm{background:#eef1f6;color:var(--muted)}
  .radar .notif-btn{margin-left:auto}
  .notif-state{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .notif-state.on{color:#3f7a45}
  .dotmini{width:7px;height:7px;border-radius:50%;background:currentColor}

  /* main grid */
  .grid2{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  .cal{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .month{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.4px;text-transform:capitalize}
  .nav{display:flex;gap:6px}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--paper);
    cursor:pointer;display:grid;place-items:center;color:var(--ink)}
  .icon-btn:hover{border-color:#cfd6e4;background:#f7f9fc}
  .icon-btn svg{width:16px;height:16px}
  .cal-head .spacer{flex:1}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  .legend .g{background:var(--gold)} .legend .s{background:var(--steel)} .legend .t{background:var(--teal)}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .dow span{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:4px 0}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{min-height:82px;border:1px solid var(--line);border-radius:11px;padding:7px 7px 6px;
    cursor:pointer;background:var(--paper);position:relative;transition:border-color .12s,box-shadow .12s}
  .cell:hover{border-color:#cfd6e4;box-shadow:0 4px 14px rgba(20,33,61,.06)}
  .cell.out{background:#fafbfd}
  .cell.out .dnum{color:#c2c9d6}
  .cell.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .dnum{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:600;color:var(--text);
    width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
  .cell.today .dnum{background:var(--brand);color:#fff}
  .pills{display:flex;flex-direction:column;gap:3px;margin-top:5px}
  .pill{font-size:11px;font-weight:600;line-height:1.25;padding:2px 6px;border-radius:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
  .pill.g{background:var(--gold-soft);color:#7d5713} .pill.s{background:var(--steel-soft);color:#274d82}
  .pill.t{background:var(--teal-soft);color:#1f5f57}
  .pill.done{background:#eef1f6;color:var(--done);text-decoration:line-through}
  .pill .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .pill.g .pd{background:var(--gold)} .pill.s .pd{background:var(--steel)} .pill.t .pd{background:var(--teal)}
  .pill .ph{font-weight:700;opacity:.85;margin-right:1px}
  .more{font-size:10.5px;color:var(--muted);font-weight:600;padding:1px 6px}

  /* day panel */
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;position:sticky;top:18px}
  .panel h2{font-family:"Space Grotesk",sans-serif;font-size:16px;color:var(--ink);font-weight:600}
  .panel .subd{font-size:12.5px;color:var(--muted);margin-bottom:14px;text-transform:capitalize}
  .empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:13px}
  .empty svg{width:34px;height:34px;color:#cdd4e0;margin-bottom:8px}
  .task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .check{width:20px;height:20px;border-radius:6px;border:1.8px solid #cfd6e4;flex:0 0 auto;cursor:pointer;
    margin-top:1px;display:grid;place-items:center;transition:.12s}
  .check:hover{border-color:var(--brand)}
  .check.on{background:var(--brand);border-color:var(--brand)}
  .check svg{width:12px;height:12px;color:#fff;opacity:0}
  .check.on svg{opacity:1}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:13.5px;font-weight:600;color:var(--ink)}
  .task.done .task-title{color:var(--done);text-decoration:line-through}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.2px}
  .tag.g{background:var(--gold-soft);color:#7d5713} .tag.s{background:var(--steel-soft);color:#274d82}
  .tag.t{background:var(--teal-soft);color:#1f5f57}
  .time-badge{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
  .time-badge svg{width:12px;height:12px}
  .task-note{font-size:12px;color:var(--muted);margin-top:3px}
  .del{background:none;border:0;color:#c2c9d6;cursor:pointer;padding:3px;border-radius:6px;flex:0 0 auto}
  .del:hover{color:var(--danger);background:var(--danger-soft)}
  .del svg{width:15px;height:15px;display:block}
  .panel-add{margin-top:14px}
  .panel-add .btn{width:100%;justify-content:center}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,33,61,.4);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .overlay.show{display:flex}
  .modal{background:var(--paper);border-radius:18px;box-shadow:0 20px 60px rgba(20,33,61,.3);
    width:100%;max-width:440px;padding:24px}
  .modal h3{font-family:"Space Grotesk",sans-serif;font-size:18px;color:var(--ink);font-weight:600;margin-bottom:18px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .field input[type=text],.field input[type=date],.field input[type=number],.field textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;
    font-size:14px;color:var(--text);background:#fbfcfe;transition:.12s}
  .field input:focus,.field textarea:focus{outline:0;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
  .field textarea{resize:vertical;min-height:56px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{border:1.5px solid var(--line);background:#fbfcfe;border-radius:10px;padding:11px 9px;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left;transition:.12s;line-height:1.25}
  .seg button small{display:block;font-weight:500;font-size:10.5px;margin-top:2px}
  .seg button.sel-g{border-color:var(--gold);background:var(--gold-soft);color:#7d5713}
  .seg button.sel-s{border-color:var(--steel);background:var(--steel-soft);color:#274d82}
  .seg button.sel-t{border-color:var(--teal);background:var(--teal-soft);color:#1f5f57}
  @media(max-width:480px){.seg{grid-template-columns:1fr}}
  .wd-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .wd-picker button{border:1.5px solid var(--line);background:#fbfcfe;border-radius:9px;padding:9px 0;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);transition:.12s}
  .wd-picker button.on{border-color:var(--teal);background:var(--teal);color:#fff}
  .wd-preset{margin-top:8px;background:none;border:0;color:var(--teal);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 0}
  .wd-preset:hover{text-decoration:underline}
  .field input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-family:inherit;font-size:14px;color:var(--text);background:#fbfcfe}
  .field input[type=time]:focus{outline:0;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn{flex:1;justify-content:center}
  .hidden{display:none}

  /* relatório */
  .modal.wide{max-width:580px}
  .rep-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .rep-nav{display:flex;gap:6px}
  .rep-title-h{font-family:"Space Grotesk",sans-serif;font-size:18px;color:var(--ink);font-weight:600;text-transform:capitalize}
  .rep-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .rep-body{max-height:62vh;overflow:auto;margin:0 -4px;padding:0 4px}
  .rep-day{margin-bottom:15px}
  .rep-date{font-size:12px;font-weight:700;color:var(--brand);text-transform:capitalize;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .rep-item{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
  .rep-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
  .rep-dot.g{background:var(--gold)} .rep-dot.s{background:var(--steel)} .rep-dot.t{background:var(--teal)}
  .rep-title2{font-size:13.5px;font-weight:600;color:var(--ink)}
  .rep-note{font-size:12px;color:var(--muted);margin-top:1px}
  .report-actions{display:flex;gap:10px;margin-top:18px}
  .report-actions .btn{flex:1;justify-content:center}
  @media print{
    body *{visibility:hidden}
    #reportOverlay, #reportOverlay *{visibility:visible}
    #reportOverlay{position:absolute;inset:0;background:#fff;padding:0;display:block}
    #reportModal{box-shadow:none;max-width:100%;width:100%;border-radius:0;padding:0}
    .rep-body{max-height:none;overflow:visible}
    .report-actions,.rep-nav{display:none}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="2.2" fill="currentColor" stroke="none"/></svg>
      </div>
      <div><h1>Agenda de Demandas</h1><span>Fixas mensais e datas específicas</span></div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="todayBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Hoje
    </button>
    <button class="btn btn-ghost" id="reportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M9 13h6M9 17h4"/></svg>
      Relatório do mês
    </button>
    <button class="btn btn-primary" id="newBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nova demanda
    </button>
  </div>

  <div class="radar" id="radar">
    <div class="radar-lead">
      <span class="radar-pulse"></span>
      <div><b>Radar</b><small>Avisos do dia e véspera</small></div>
    </div>
    <div class="radar-items" id="radarItems"></div>
    <button class="btn btn-ghost notif-btn" id="notifBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Ativar avisos
    </button>
    <span class="notif-state hidden" id="notifState"><span class="dotmini"></span>Avisos ativos</span>
  </div>

  <div class="grid2">
    <div class="cal">
      <div class="cal-head">
        <div class="nav">
          <button class="icon-btn" id="prevBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="nextBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="month" id="monthLabel"></div>
        <div class="spacer"></div>
        <div class="legend"><span><i class="g"></i>Fixa mensal</span><span><i class="t"></i>Semanal</span><span><i class="s"></i>Data específica</span></div>
      </div>
      <div class="dow"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
      <div class="days" id="daysGrid"></div>
    </div>

    <div class="panel">
      <h2 id="panelTitle">Selecione um dia</h2>
      <div class="subd" id="panelDate"></div>
      <div id="panelList"></div>
      <div class="panel-add">
        <button class="btn btn-ghost" id="addHereBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar neste dia
        </button>
      </div>
    </div>
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Nova demanda</h3>
    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitle" placeholder="Ex.: Fechar inventário de saídas" maxlength="80" />
    </div>
    <div class="field">
      <label>Tipo</label>
      <div class="seg">
        <button type="button" id="typeMensal" data-type="mensal">Fixa mensal<small>Repete todo mês</small></button>
        <button type="button" id="typeSemanal" data-type="semanal">Semanal<small>Dias da semana</small></button>
        <button type="button" id="typeData" data-type="data">Data específica<small>Acontece uma vez</small></button>
      </div>
    </div>
    <div class="field" id="fieldDay">
      <label>Dia do mês</label>
      <input type="number" id="fDay" min="1" max="31" placeholder="1 a 31" />
    </div>
    <div class="field hidden" id="fieldWeek">
      <label>Dias da semana</label>
      <div class="wd-picker" id="wdPicker">
        <button type="button" data-wd="0">Dom</button>
        <button type="button" data-wd="1">Seg</button>
        <button type="button" data-wd="2">Ter</button>
        <button type="button" data-wd="3">Qua</button>
        <button type="button" data-wd="4">Qui</button>
        <button type="button" data-wd="5">Sex</button>
        <button type="button" data-wd="6">Sáb</button>
      </div>
      <button type="button" class="wd-preset" id="wdPreset">Selecionar dias úteis (seg–sex)</button>
    </div>
    <div class="field hidden" id="fieldDate">
      <label>Data</label>
      <input type="date" id="fDate" />
    </div>
    <div class="field">
      <label>Horário <span style="color:var(--muted);font-weight:500">(opcional)</span></label>
      <input type="time" id="fTime" />
    </div>
    <div class="field">
      <label>Observação <span style="color:var(--muted);font-weight:500">(opcional)</span></label>
      <textarea id="fNote" placeholder="Detalhes, link, responsável..." maxlength="200"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="saveBtn">Salvar demanda</button>
    </div>
  </div>
</div>

<!-- relatório -->
<div class="overlay" id="reportOverlay">
  <div class="modal wide" id="reportModal">
    <div class="rep-head">
      <div class="rep-nav">
        <button class="icon-btn" id="repPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="icon-btn" id="repNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="rep-title-h" id="repTitle">Relatório</div>
    </div>
    <div class="rep-sub" id="repSub"></div>
    <div class="rep-body" id="repBody"></div>
    <div class="report-actions">
      <button class="btn btn-ghost" id="repClose">Fechar</button>
      <button class="btn btn-primary" id="repPrint">Imprimir / Salvar PDF</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  // ===== CONFIG SUPABASE =====
  var SUPABASE_URL="https://fevhyllvfhvzzfhwyjuk.supabase.co";
  var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldmh5bGx2Zmh2enpmaHd5anVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NzEyMTcsImV4cCI6MjA5NDQ0NzIxN30.GJRgEKW1bVWX1957_bKCTO6aVmR_rXWRCmo9-ZJDPiE";
  var TABLE="agenda_demandas";
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  // ===========================
  var NKEY="agenda.notiflog.v1";
  var CACHE="agenda.cache.v1";
  var MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var DOW3=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  var demandas=[]; var loadError=false; var loading=true;
  var view = new Date(); view.setDate(1); view.setHours(0,0,0,0);
  var selected = iso(new Date());
  var draftType = "mensal";
  var draftWeekdays = [1,2,3,4,5];
  var reportMonth = new Date();
  function clsFor(t){ return t==="mensal"?"g":(t==="semanal"?"t":"s"); }
  function typeTag(dm){
    if(dm.type==="mensal") return '<span class="tag g">Fixa mensal</span>';
    if(dm.type==="semanal") return '<span class="tag t">'+weekLabel(dm.weekdays)+'</span>';
    return '<span class="tag s">Data específica</span>';
  }
  function weekLabel(wd){
    wd=(wd||[]).slice().sort(function(a,b){return a-b;});
    if(wd.length===5 && wd.join()==="1,2,3,4,5") return "Seg a Sex";
    if(wd.length===7) return "Todos os dias";
    return wd.map(function(n){return DOW3[n];}).join(", ") || "Semanal";
  }
  var clockSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  // ---------- storage (Supabase) ----------
  function mapRow(r){ return {id:r.id,title:r.title,type:r.type,day:r.day,date:r.date,weekdays:r.weekdays||[],time:r.time||"",note:r.note||"",done:r.done||{}}; }
  function cacheSave(){ try{ localStorage.setItem(CACHE, JSON.stringify(demandas)); }catch(e){} }
  function cacheLoad(){ try{ var c=JSON.parse(localStorage.getItem(CACHE)); if(Array.isArray(c)) return c; }catch(e){} return null; }
  function loadDemandas(){
    loading=true;
    return sb.from(TABLE).select("*").then(function(res){
      if(res.error){ loadError=true; console.error(res.error); }
      else if(Array.isArray(res.data)){ demandas=res.data.map(mapRow); loadError=false; cacheSave(); } // só substitui se veio lista válida
      loading=false; render();
    }).catch(function(e){ loadError=true; loading=false; console.error(e); render(); });
  }
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function parseIso(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // ---------- occurrence logic ----------
  function occursOn(dm, d){
    if(dm.type==="data") return dm.date===iso(d);
    if(dm.type==="semanal") return (dm.weekdays||[]).indexOf(d.getDay())!==-1;
    // mensal: dia do mês, ajustando para meses curtos (ex.: dia 31 em fevereiro cai no último dia)
    var eff = Math.min(dm.day, daysInMonth(d.getFullYear(), d.getMonth()));
    return d.getDate()===eff;
  }
  function demandsOn(d){
    return demandas.filter(function(dm){ return occursOn(dm,d); })
      .sort(function(a,b){ return (a.time||"99:99").localeCompare(b.time||"99:99"); });
  }
  function isDone(dm, dateStr){ return !!(dm.done && dm.done[dateStr]); }
  function toggleDone(dm, dateStr){
    dm.done=dm.done||{};
    if(dm.done[dateStr]) delete dm.done[dateStr]; else dm.done[dateStr]=true;
    cacheSave();
    sb.from(TABLE).update({done:dm.done}).eq("id",dm.id).then(function(res){
      if(res.error){ alert("Erro ao atualizar: "+res.error.message); loadDemandas(); }
    });
  }

  // ---------- render ----------
  function render(){ renderCalendar(); renderPanel(); renderRadar(); }

  function renderCalendar(){
    var y=view.getFullYear(), m=view.getMonth();
    document.getElementById("monthLabel").textContent = MESES[m]+" "+y;
    var grid=document.getElementById("daysGrid"); grid.innerHTML="";
    var first=new Date(y,m,1); var start=first.getDay();
    var cursor=new Date(y,m,1-start);
    var todayStr=iso(new Date());
    for(var i=0;i<42;i++){
      var d=new Date(cursor); cursor.setDate(cursor.getDate()+1);
      var cell=document.createElement("div"); cell.className="cell";
      var dStr=iso(d);
      if(d.getMonth()!==m) cell.classList.add("out");
      if(dStr===todayStr) cell.classList.add("today");
      if(dStr===selected) cell.classList.add("sel");
      var num=document.createElement("div"); num.className="dnum"; num.textContent=d.getDate(); cell.appendChild(num);
      var items=demandsOn(d);
      if(items.length){
        var pills=document.createElement("div"); pills.className="pills";
        items.slice(0,3).forEach(function(dm){
          var p=document.createElement("div");
          p.className="pill "+clsFor(dm.type)+(isDone(dm,dStr)?" done":"");
          p.innerHTML='<span class="pd"></span>'+(dm.time?'<span class="ph">'+esc(dm.time)+'</span> ':'')+esc(dm.title);
          pills.appendChild(p);
        });
        if(items.length>3){ var more=document.createElement("div"); more.className="more"; more.textContent="+"+(items.length-3)+" mais"; pills.appendChild(more); }
        cell.appendChild(pills);
      }
      (function(ds){ cell.addEventListener("click",function(){ selected=ds; render(); }); })(dStr);
      grid.appendChild(cell);
    }
  }

  function renderPanel(){
    var d=parseIso(selected);
    var todayStr=iso(new Date());
    document.getElementById("panelTitle").textContent = selected===todayStr ? "Hoje" : "Dia "+d.getDate();
    document.getElementById("panelDate").textContent = DIAS[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()].toLowerCase();
    var list=document.getElementById("panelList"); list.innerHTML="";
    var items=demandsOn(d);
    if(!items.length){
      list.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><div>Nenhuma demanda neste dia.</div></div>';
      return;
    }
    items.forEach(function(dm){
      var done=isDone(dm,selected);
      var row=document.createElement("div"); row.className="task"+(done?" done":"");
      var check=document.createElement("div"); check.className="check"+(done?" on":"");
      check.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>';
      check.addEventListener("click",function(){ toggleDone(dm,selected); render(); });
      var body=document.createElement("div"); body.className="task-body";
      var meta=typeTag(dm)+(dm.time?'<span class="time-badge">'+clockSvg+esc(dm.time)+'</span>':'');
      body.innerHTML='<div class="task-title">'+esc(dm.title)+'</div><div class="task-meta">'+meta+'</div>'+(dm.note?'<div class="task-note">'+esc(dm.note)+'</div>':'');
      var del=document.createElement("button"); del.className="del"; del.title="Excluir demanda";
      del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>';
      del.addEventListener("click",function(){
        if(confirm('Excluir "'+dm.title+'"?'+(dm.type!=="data"?" Isso remove a demanda de todas as ocorrências.":""))){
          sb.from(TABLE).delete().eq("id",dm.id).then(function(res){
            if(res.error){ alert("Erro ao excluir: "+res.error.message); return; }
            demandas=demandas.filter(function(x){return x.id!==dm.id;}); cacheSave(); render();
          });
        }
      });
      row.appendChild(check); row.appendChild(body); row.appendChild(del);
      list.appendChild(row);
    });
  }

  function renderRadar(){
    var rbox=document.getElementById("radarItems"); var radarEl=document.getElementById("radar");
    if(loadError && !demandas.length){ radarEl.classList.remove("hot"); rbox.innerHTML='<span class="chip late">Erro ao conectar no Supabase — confira a tabela e as políticas</span>'; return; }
    if(loading && !demandas.length){ radarEl.classList.remove("hot"); rbox.innerHTML='<span class="chip calm">Carregando…</span>'; return; }
    var today=new Date(); today.setHours(0,0,0,0);
    var tmrw=new Date(today); tmrw.setDate(tmrw.getDate()+1);
    var todayStr=iso(today);
    var hoje=demandsOn(today).filter(function(dm){return !isDone(dm,todayStr);});
    var amanha=demandsOn(tmrw).filter(function(dm){return dm.type!=="semanal" && !isDone(dm,iso(tmrw));});
    var late=lateItems(today);
    var box=document.getElementById("radarItems"); box.innerHTML="";
    var radar=document.getElementById("radar");
    var hot=hoje.length||amanha.length||late.length;
    radar.classList.toggle("hot", !!hot);
    if(!hot){ box.innerHTML='<span class="chip calm">Nada por perto — tudo em dia</span>'; }
    else {
      if(hoje.length) box.appendChild(chip("today","Hoje: "+labelList(hoje)));
      if(amanha.length) box.appendChild(chip("tmrw","Amanhã: "+labelList(amanha)));
      if(late.length) box.appendChild(chip("late","Atrasadas: "+labelList(late)));
    }
    if(loadError){ box.appendChild(chip("late","Sem conexão — mostrando dados salvos")); }
  }
  function lateItems(today){
    var out=[];
    demandas.forEach(function(dm){
      if(dm.type!=="data") return;
      var dd=parseIso(dm.date); dd.setHours(0,0,0,0);
      if(dd<today && !isDone(dm,dm.date)) out.push(dm);
    });
    return out;
  }
  function labelList(arr){ return arr.map(function(d){return (d.time?d.time+" ":"")+d.title;}).join(", "); }
  function chip(cls,text){ var s=document.createElement("span"); s.className="chip "+cls; s.textContent=text; return s; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  // ---------- notifications ----------
  function nlog(){ try{ return JSON.parse(localStorage.getItem(NKEY))||{}; }catch(e){ return {}; } }
  function nsave(o){ try{ localStorage.setItem(NKEY, JSON.stringify(o)); }catch(e){} }
  function refreshNotifUI(){
    var btn=document.getElementById("notifBtn"), st=document.getElementById("notifState");
    if(!("Notification" in window)){ btn.classList.add("hidden"); st.classList.remove("hidden"); st.classList.remove("on"); st.querySelector("span").style.display="none"; st.lastChild.textContent="Navegador sem suporte a avisos"; return; }
    if(Notification.permission==="granted"){ btn.classList.add("hidden"); st.classList.remove("hidden"); st.classList.add("on"); }
    else { btn.classList.remove("hidden"); st.classList.add("hidden"); }
  }
  function askNotif(){
    if(!("Notification" in window)) return;
    Notification.requestPermission().then(function(){ refreshNotifUI(); checkNotifications(); });
  }
  function fire(title, body){
    try{ var n=new Notification(title,{body:body, tag:title+body, icon:iconData()}); n.onclick=function(){ window.focus(); n.close(); }; }catch(e){}
  }
  function iconData(){
    return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%231e2e52"><rect x="3" y="4" width="18" height="17" rx="3" fill="%231e2e52"/><circle cx="12" cy="14" r="3" fill="white"/></svg>');
  }
  function notifBody(dm, quando){
    var parts=[];
    if(dm.time) parts.push("Horário: "+dm.time);
    if(dm.note) parts.push(dm.note);
    return parts.join(" · ") || ("Demanda para "+quando+".");
  }
  function checkNotifications(){
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    var now=new Date();
    var today=new Date(); today.setHours(0,0,0,0);
    var tmrw=new Date(today); tmrw.setDate(tmrw.getDate()+1);
    var todayStr=iso(today);
    var log=nlog(); var fired=log[todayStr]||[]; var changed=false;
    // véspera (1 dia antes) — não vale para semanal, senão avisaria toda noite
    demandsOn(tmrw).forEach(function(dm){
      if(dm.type==="semanal" || isDone(dm,iso(tmrw))) return;
      var tk="v:"+dm.id;
      if(fired.indexOf(tk)===-1){ fire("Amanhã: "+dm.title, notifBody(dm,"amanhã")); fired.push(tk); changed=true; }
    });
    // no dia
    demandsOn(today).forEach(function(dm){
      if(isDone(dm,todayStr)) return;
      var tk="d:"+dm.id;
      if(fired.indexOf(tk)!==-1) return;
      if(dm.time){
        // com horário: avisa 5 min antes (ou depois, se abrir a página mais tarde)
        var hm=dm.time.split(":"); var due=new Date(today);
        due.setHours(parseInt(hm[0],10)||0, parseInt(hm[1],10)||0, 0, 0);
        var warnAt=new Date(due.getTime()-5*60*1000);
        if(now < warnAt) return;
        fire(dm.time+" · "+dm.title, "Em ~5 min"+(dm.note?" · "+dm.note:""));
      } else {
        fire("Hoje: "+dm.title, notifBody(dm,"hoje"));
      }
      fired.push(tk); changed=true;
    });
    if(changed){ log[todayStr]=fired; // limpa logs antigos
      Object.keys(log).forEach(function(k){ if(k<todayStr) delete log[k]; }); nsave(log); }
  }

  // ---------- relatório ----------
  function reportRows(y,m){
    var rows=[];
    demandas.forEach(function(dm){
      if(!dm.done) return;
      Object.keys(dm.done).forEach(function(k){
        if(!dm.done[k]) return;
        var p=k.split("-");
        if(+p[0]===y && (+p[1]-1)===m) rows.push({date:k, title:dm.title, note:dm.note, type:dm.type});
      });
    });
    rows.sort(function(a,b){ return a.date.localeCompare(b.date) || a.title.localeCompare(b.title); });
    return rows;
  }
  function renderReport(){
    var y=reportMonth.getFullYear(), m=reportMonth.getMonth();
    document.getElementById("repTitle").textContent="Relatório de "+MESES[m]+" "+y;
    var rows=reportRows(y,m);
    document.getElementById("repSub").textContent = rows.length ? (rows.length+(rows.length===1?" demanda concluída no mês":" demandas concluídas no mês")) : "";
    var body=document.getElementById("repBody"); body.innerHTML="";
    if(!rows.length){ body.innerHTML='<div class="empty" style="padding:32px 10px">Nenhuma demanda concluída em '+MESES[m].toLowerCase()+'.</div>'; return; }
    var lastDate=null, group=null;
    rows.forEach(function(r){
      if(r.date!==lastDate){
        lastDate=r.date; group=document.createElement("div"); group.className="rep-day";
        var d=parseIso(r.date);
        var head=document.createElement("div"); head.className="rep-date";
        head.textContent = String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" · "+DIAS[d.getDay()];
        group.appendChild(head); body.appendChild(group);
      }
      var it=document.createElement("div"); it.className="rep-item";
      it.innerHTML='<span class="rep-dot '+clsFor(r.type)+'"></span><div><div class="rep-title2">'+esc(r.title)+'</div>'+(r.note?'<div class="rep-note">'+esc(r.note)+'</div>':'')+'</div>';
      group.appendChild(it);
    });
  }
  function openReport(){ reportMonth=new Date(view.getFullYear(),view.getMonth(),1); renderReport(); document.getElementById("reportOverlay").classList.add("show"); }
  function closeReport(){ document.getElementById("reportOverlay").classList.remove("show"); }

  // ---------- modal ----------
  var overlay=document.getElementById("overlay");
  function openModal(preDate){
    document.getElementById("fTitle").value="";
    document.getElementById("fNote").value="";
    document.getElementById("fDay").value="";
    document.getElementById("fTime").value="";
    draftWeekdays=[1,2,3,4,5];
    if(preDate){ setType("data"); document.getElementById("fDate").value=preDate; }
    else { setType("mensal"); document.getElementById("fDate").value=selected; }
    overlay.classList.add("show");
    setTimeout(function(){ document.getElementById("fTitle").focus(); },50);
  }
  function closeModal(){ overlay.classList.remove("show"); }
  function renderWeekPicker(){
    var btns=document.getElementById("wdPicker").querySelectorAll("button");
    btns.forEach(function(b){ var wd=+b.getAttribute("data-wd"); b.classList.toggle("on", draftWeekdays.indexOf(wd)!==-1); });
  }
  function setType(t){
    draftType=t;
    document.getElementById("typeMensal").className = t==="mensal"?"sel-g":"";
    document.getElementById("typeSemanal").className = t==="semanal"?"sel-t":"";
    document.getElementById("typeData").className = t==="data"?"sel-s":"";
    document.getElementById("fieldDay").classList.toggle("hidden", t!=="mensal");
    document.getElementById("fieldWeek").classList.toggle("hidden", t!=="semanal");
    document.getElementById("fieldDate").classList.toggle("hidden", t!=="data");
    if(t==="semanal") renderWeekPicker();
  }
  function saveDemand(){
    var title=document.getElementById("fTitle").value.trim();
    if(!title){ alert("Dê um título para a demanda."); return; }
    var note=document.getElementById("fNote").value.trim();
    var time=document.getElementById("fTime").value||null;
    var payload={title:title, type:draftType, note:note, time:time, done:{}};
    if(draftType==="mensal"){
      var day=parseInt(document.getElementById("fDay").value,10);
      if(!(day>=1 && day<=31)){ alert("Informe um dia do mês entre 1 e 31."); return; }
      payload.day=day;
    } else if(draftType==="semanal"){
      if(!draftWeekdays.length){ alert("Escolha pelo menos um dia da semana."); return; }
      payload.weekdays=draftWeekdays.slice().sort(function(a,b){return a-b;});
    } else {
      var dt=document.getElementById("fDate").value;
      if(!dt){ alert("Escolha uma data."); return; }
      payload.date=dt; selected=dt; var pd=parseIso(dt); view=new Date(pd.getFullYear(),pd.getMonth(),1);
    }
    var btn=document.getElementById("saveBtn"); btn.disabled=true; btn.textContent="Salvando…";
    sb.from(TABLE).insert(payload).select().single().then(function(res){
      btn.disabled=false; btn.textContent="Salvar demanda";
      if(res.error){ alert("Erro ao salvar: "+res.error.message); return; }
      demandas.push(mapRow(res.data)); cacheSave(); closeModal(); render();
    });
  }

  // ---------- events ----------
  document.getElementById("prevBtn").addEventListener("click",function(){ view.setMonth(view.getMonth()-1); render(); });
  document.getElementById("nextBtn").addEventListener("click",function(){ view.setMonth(view.getMonth()+1); render(); });
  document.getElementById("todayBtn").addEventListener("click",function(){ var n=new Date(); view=new Date(n.getFullYear(),n.getMonth(),1); selected=iso(n); render(); });
  document.getElementById("newBtn").addEventListener("click",function(){ openModal(null); });
  document.getElementById("addHereBtn").addEventListener("click",function(){ openModal(selected); });
  document.getElementById("cancelBtn").addEventListener("click",closeModal);
  document.getElementById("saveBtn").addEventListener("click",saveDemand);
  document.getElementById("typeMensal").addEventListener("click",function(){ setType("mensal"); });
  document.getElementById("typeSemanal").addEventListener("click",function(){ setType("semanal"); });
  document.getElementById("typeData").addEventListener("click",function(){ setType("data"); });
  document.getElementById("wdPicker").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    var wd=+b.getAttribute("data-wd"); var i=draftWeekdays.indexOf(wd);
    if(i===-1) draftWeekdays.push(wd); else draftWeekdays.splice(i,1);
    renderWeekPicker();
  });
  document.getElementById("wdPreset").addEventListener("click",function(){ draftWeekdays=[1,2,3,4,5]; renderWeekPicker(); });
  document.getElementById("notifBtn").addEventListener("click",askNotif);
  document.getElementById("reportBtn").addEventListener("click",openReport);
  document.getElementById("repClose").addEventListener("click",closeReport);
  document.getElementById("repPrint").addEventListener("click",function(){ window.print(); });
  document.getElementById("repPrev").addEventListener("click",function(){ reportMonth.setMonth(reportMonth.getMonth()-1); renderReport(); });
  document.getElementById("repNext").addEventListener("click",function(){ reportMonth.setMonth(reportMonth.getMonth()+1); renderReport(); });
  document.getElementById("reportOverlay").addEventListener("click",function(e){ if(e.target.id==="reportOverlay") closeReport(); });
  overlay.addEventListener("click",function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeModal(); closeReport(); } });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ loadDemandas().then(function(){ checkNotifications(); }); } });

  // ---------- boot ----------
  refreshNotifUI();
  var cached=cacheLoad(); if(cached){ demandas=cached; loading=false; } // mostra na hora, sem tela vazia
  render();
  loadDemandas().then(function(){ checkNotifications(); });
  setInterval(checkNotifications, 30*1000); // revê a cada 30s (pontualidade no horário)
})();
</script>
</body>
</html>
